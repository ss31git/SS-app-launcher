name: .NET API CI/CD

on:
  push:
    paths: ['api-dotnet/**']
    branches: [main]
  pull_request:
    paths: ['api-dotnet/**']

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore
        working-directory: api-dotnet

      - name: Build & Publish
        run: dotnet publish --configuration Release -o publish
        working-directory: api-dotnet

      # To enable deployment, add AZURE_DOTNET_FUNCTION_APP_NAME and
      # AZURE_DOTNET_PUBLISH_PROFILE to GitHub Secrets, then uncomment below.
      # - name: Deploy to Azure Functions
      #   uses: Azure/functions-action@v1
      #   with:
      #     app-name: ${{ secrets.AZURE_DOTNET_FUNCTION_APP_NAME }}
      #     package: api-dotnet/publish
      #     publish-profile: ${{ secrets.AZURE_DOTNET_PUBLISH_PROFILE }}

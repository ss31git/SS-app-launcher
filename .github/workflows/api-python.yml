name: Python API CI/CD

on:
  push:
    paths: ['api-python/**']
    branches: [main]
  pull_request:
    paths: ['api-python/**']

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt --target=".python_packages/lib/site-packages"
        working-directory: api-python

      # To enable deployment, add AZURE_PYTHON_FUNCTION_APP_NAME and
      # AZURE_PYTHON_PUBLISH_PROFILE to GitHub Secrets, then uncomment below.
